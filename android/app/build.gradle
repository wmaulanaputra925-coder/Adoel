plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.jekael.adoel'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jekael.adoel'
        minSdk 24
        targetSdk 36
        // CI passes VERSION_CODE (its own monotonically-increasing run number) so versionCode
        // always advances automatically; local builds fall back to a static value.
        versionCode (System.getenv("VERSION_CODE") != null ? System.getenv("VERSION_CODE").toInteger() : 14)
        versionName "10.3.0"
    }

    // Release signing reads the keystore + passwords from environment variables. In CI these come
    // from GitHub Secrets (the keystore itself is never committed to the repo). If the env vars are
    // absent (e.g. a plain local build), the release build is simply left unsigned.
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    // DoffViewModelTest constructs a plain android.app.Application and calls no framework
    // methods on it (the DataStore-backed repo write is never pumped under a StandardTestDispatcher
    // that's never advanced) — returnDefaultValues avoids the stub jar's "not mocked" exceptions
    // for any incidental Android API touch, without pulling in Robolectric for this.
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    // Informational only — surfaces warnings in local/CI logs without ever failing the build.
    // Tightening to abortOnError=true would need a baseline generated on a machine that can run
    // lint (the CI sandbox used for development can't reach dl.google.com to run Gradle).
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.glance:glance-appwidget:1.1.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
